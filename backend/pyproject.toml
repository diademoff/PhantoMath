[project]
name = "mymath-backend"
version = "0.1.0"
description = "PhantoMath solver: step-by-step explanations for school and university maths"
license = "GPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sympy>=1.14",
]

[project.optional-dependencies]
# HTTP-слой. На устройстве не нужен: там решатель вызывается напрямую, а
# модели контракта -- dataclasses без pydantic (см. mymath_backend/ast.py).
api = [
    "fastapi>=0.143",
    "uvicorn[standard]>=0.40",
    "pydantic>=2.14",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "httpx2>=2.13",   # требуется starlette.testclient
    "ruff>=0.15",
    "mypy>=1.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mymath_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "D", "ANN"]
ignore = [
    "D203",  # конфликтует с D211
    "D213",  # конфликтует с D212
    # Проект документирован по-русски: RUF001-003 считают кириллицу
    # "неоднозначным символом" относительно латиницы, что здесь ложно.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103", "ANN401"]
# Длинные имена типов узлов переносить нельзя.
"mymath_backend/node_types.py" = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

# У sympy нет аннотаций (нет py.typed): считаем его динамическим.
[[tool.mypy.overrides]]
module = ["sympy", "sympy.*"]
ignore_missing_imports = true