name: mymath_app
description: "Решатель математики с пошаговым объяснением. Переписывание Photomath 7.10.0."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # HTTP-клиент к бэкенду. Без него не обойтись: решатель живёт в Python.
  http: ^1.5.0

  # Рендер формул. Наш AST приводится к LaTeX и отрисовывается им:
  # писать свой рендер дробей и корней — это отдельный проект.
  flutter_math_fork: ^0.7.4

  # Блокнот: путь к каталогу приложения для локального файла истории.
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
